name: takas_uygulamasi
description: iOS tarzı cam efektli takas uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0

  # Auth
  google_sign_in: ^6.2.2

  # State / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI / utils
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ">=0.19.0 <0.21.0"
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
