name: Build Android APK

on:
  push:
    branches: [ "arena/c96d2a66-takas-uygulamasi", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name takas_uygulamasi --org com.takasuygulamasi .
          fi

      - name: Patch Android build config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
              if not p.exists():
                  continue
              s = p.read_text()
              # minSdk 23
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              # core library desugaring enable
              if 'isCoreLibraryDesugaringEnabled' not in s and 'coreLibraryDesugaringEnabled' not in s:
                  if 'compileOptions {' in s:
                      if p.suffix == '.kts':
                          s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                      else:
                          s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              # remove any previous desugar dep lines, then append a clean one at end
              s = re.sub(r'(?m)^\s*coreLibraryDesugaring\(.*desugar_jdk_libs.*\)\s*\n?', '', s)
              s = re.sub(r"(?m)^\s*coreLibraryDesugaring\s+['\"]com\.android\.tools:desugar_jdk_libs.*['\"]\s*\n?", '', s)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if p.suffix == '.kts' else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              s = s.rstrip() + "\n\ndependencies {\n    " + dep + "\n}\n"
              p.write_text(s)
              print('patched', p)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Publish build log to debug release (on failure)
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -400 build.log > build_tail.log
          {
            echo "# Build log (son 400 satır)"
            echo
            echo '```'
            cat build_tail.log
            echo '```'
          } > release_body.md
          gh release delete debug-build-log -y --cleanup-tag || true
          gh release create debug-build-log --prerelease --title "Debug build log" --notes-file release_body.md

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Create/Update GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-debug"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --prerelease --title "Takas Uygulaması Debug APK" \
            --notes "Firebase yapılandırması yapılmadan üretilmiş debug APK. Firebase özellikleri için flutterfire configure sonrası yeniden build alın." \
            build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takas-uygulamasi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
