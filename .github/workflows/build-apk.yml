name: Build Android APK

on:
  push:
    branches: [ "arena/c96d2a66-takas-uygulamasi", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name takas_uygulamasi --org com.takasuygulamasi .
          fi

      - name: Patch Android build config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # minSdk 23 + core library desugaring (flutter_local_notifications vb. için)
          for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
              if not p.exists():
                  continue
              s = p.read_text()
              # minSdk
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              # desugaring
              if 'isCoreLibraryDesugaringEnabled' not in s and 'coreLibraryDesugaringEnabled' not in s:
                  if 'compileOptions {' in s:
                      s = s.replace(
                          'compileOptions {',
                          'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                          1
                      ) if p.suffix == '.kts' else s.replace(
                          'compileOptions {',
                          'compileOptions {\n        coreLibraryDesugaringEnabled true',
                          1
                      )
              if 'desugar_jdk_libs' not in s:
                  if p.suffix == '.kts':
                      s = re.sub(r'(dependencies\s*\{)', r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', s, count=1)
                  else:
                      s = re.sub(r'(dependencies\s*\{)', r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", s, count=1)
              p.write_text(s)
              print('patched', p)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takas-uygulamasi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
